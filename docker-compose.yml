services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: openrecs
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Host port 5434 so multiple local Postgres instances can coexist on
      # the dev box (5432 and 5433 are commonly taken). In-network the
      # service is still reachable as postgres:5432, so the app/worker
      # DATABASE_URLs below are unchanged. Host-side connections
      # (pnpm dev, db:migrate, db:seed) use 5434.
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d openrecs"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: app-runtime
    restart: unless-stopped
    env_file: .env
    environment:
      # Override host-oriented paths/hosts from .env inside compose. The app
      # and worker must resolve filesystem storage to the SAME mounted volume;
      # a relative ./.data/uploads path would point at separate container
      # filesystems and the worker would not be able to read uploaded PDFs.
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/openrecs
      STORAGE_FS_PATH: /data/uploads
    ports:
      - "3000:3000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: worker-runtime
    restart: unless-stopped
    env_file: .env
    environment:
      # See note on `app.environment` above. Keep this path identical to the
      # app so source.parse can read the exact blob written during upload.
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/openrecs
      STORAGE_FS_PATH: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
